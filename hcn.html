<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Rectangles</title>
    <style>
        .outside {
            border: 6px dotted blue;
            border-radius: 60px;
            padding: 30px;
        }
        .middle {
            border: 2px dashed red;
            border-radius: 40px;
            padding: 30px;
        }
        .inner {
            border: 2px solid green;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            font-size: 28px;
        }
    </style>
</head>
<body>
    <div class="outside">
        <div class="middle">
            <div class="inner">
                I am heavily packed &lt;DIV&gt;
            </div>
        </div>
    </div>
</body>
</html>
